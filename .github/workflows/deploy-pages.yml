name: Deploy Web Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Godot Web templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.6.2.stable
          key: godot-4.6.2-web-templates
      - name: Install Godot 4.6.2
        run: |
          curl --fail --location --output godot.zip https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v4.6.2-stable_linux.x86_64"
      - name: Install Web templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.2.stable"
          curl --fail --location --output templates.tpz https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
          unzip -q -j templates.tpz "templates/web*.zip" -d "$HOME/.local/share/godot/export_templates/4.6.2.stable"
      - name: Export web build
        run: mkdir -p build/web && "$HOME/godot/Godot_v4.6.2-stable_linux.x86_64" --headless --path . --export-release "Web" build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
